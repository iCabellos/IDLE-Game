name: idle_rpg
description: Idle RPG + Steam Market — Flutter client (mobile + desktop).
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"
  flutter: ">=3.22.0"

dependencies:
  flutter:
    sdk: flutter

  # State management
  flutter_bloc: ^9.1.1

  # Routing
  go_router: ^17.3.0

  # Networking
  dio: ^5.4.0

  # Local cache / storage
  hive_flutter: ^1.1.0
  flutter_secure_storage: ^10.3.1

  # Animations
  flutter_animate: ^4.5.0

  # Codegen models
  freezed_annotation: ^3.1.0
  json_annotation: ^4.8.1

  # Dependency injection
  get_it: ^9.2.1
  injectable: ^3.0.0

  # Images
  cached_network_image: ^3.3.1

  cupertino_icons: ^1.0.6

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

  build_runner: ^2.4.11
  freezed: ^3.2.5
  json_serializable: ^6.8.0
  injectable_generator: ^3.0.2

  bloc_test: ^10.0.0
  mocktail: ^1.0.3

flutter:
  uses-material-design: true
